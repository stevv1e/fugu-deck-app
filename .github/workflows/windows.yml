# Windows-клиент: Expo web export (metro web) + Electron → NSIS-инсталлятор .exe
name: windows
on:
  push:
    branches: [main]
    paths: ["mobile/**", "desktop/windows/**", ".github/workflows/windows.yml", "VERSION"]
  workflow_dispatch: {}
  release: {types: [created]}

permissions: {contents: write}

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json}
      - run: npm ci
        working-directory: mobile
      - name: Версия приложения
        run: |
          echo "DECK_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          echo "DECK_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Web export (expo-router web)
        working-directory: mobile
        run: npx expo export --platform web
      - name: Сборка NSIS (.exe)
        working-directory: desktop/windows
        shell: bash
        run: |
          rm -rf dist && cp -r ../../mobile/dist ./dist
          npm ci
          npm test
          npx electron-builder --win nsis --x64
      - name: Имя релизного EXE
        working-directory: desktop/windows
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXE=$(ls release/*.exe | head -1)
          mv "$EXE" "release/Fugu-Deck-Setup-${VERSION}.exe"
      - name: Подписанный update manifest
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        env:
          DECK_UPDATE_PRIVATE_KEY: ${{ secrets.DECK_UPDATE_PRIVATE_KEY }}
        run: node scripts/sign-update-manifest.mjs windows "$DECK_VERSION" "desktop/windows/release/Fugu-Deck-Setup-${DECK_VERSION}.exe" desktop/windows/release/update-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: fugu-deck-windows
          path: desktop/windows/release/*.exe
          retention-days: 14
          if-no-files-found: error
      - name: EXE в GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/windows/release/*.exe
            desktop/windows/release/update-windows.json
          generate_release_notes: true
