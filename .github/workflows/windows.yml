# Windows-клиент: Expo web export (metro web) + Electron → NSIS-инсталлятор .exe
name: windows
on:
  push:
    branches: [main]
    paths: ["mobile/**", "desktop/windows/**", ".github/workflows/windows.yml", "VERSION"]
  workflow_dispatch: {}
  release: {types: [created]}

permissions: {contents: read}

jobs:
  exe:
    runs-on: [self-hosted, deck]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json}
      - run: npm ci
        working-directory: mobile
      - name: Web export (expo-router web)
        working-directory: mobile
        run: npx expo export --platform web
      - name: Сборка NSIS (.exe)
        working-directory: desktop/windows
        run: |
          rm -rf dist && cp -r ../../mobile/dist ./dist
          npm ci
          npx electron-builder --win nsis --x64
      - uses: actions/upload-artifact@v4
        with:
          name: fugu-deck-windows
          path: desktop/windows/release/*.exe
          retention-days: 14
          if-no-files-found: error
      - name: EXE в GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/windows/release/*.exe
          generate_release_notes: true
