# Windows-клиент: Expo web export (metro web) + Electron → NSIS-инсталлятор .exe
name: windows
on:
  push:
    branches: [main]
    paths: ["mobile/**", "desktop/windows/**", ".github/workflows/windows.yml", "VERSION"]
  workflow_dispatch: {}
  release: {types: [created]}

permissions: {contents: write}

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json}
      - run: npm ci
        working-directory: mobile
      - name: Версия приложения
        run: |
          echo "DECK_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          echo "DECK_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Web export (expo-router web)
        working-directory: mobile
        run: npx expo export --platform web
      - name: Сборка NSIS (.exe)
        working-directory: desktop/windows
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          DECK_WINDOWS_PUBLISHER: ${{ vars.DECK_WINDOWS_PUBLISHER }}
          DECK_REQUIRE_AUTHENTICODE: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' }}
        run: |
          rm -rf dist release.json && cp -r ../../mobile/dist ./dist
          npm ci
          npm test
          node configure-signing.js release.json
          if node -e "process.exit(require('./release.json').windowsPublisher ? 0 : 1)"; then
            npx electron-builder --win nsis --x64 --config.forceCodeSigning=true
          else
            npx electron-builder --win nsis --x64
          fi
      - name: Имя релизного EXE
        working-directory: desktop/windows
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXE=$(ls release/*.exe | head -1)
          mv "$EXE" "release/Fugu-Deck-Setup-${VERSION}.exe"
      - name: Проверка Authenticode релиза
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        working-directory: desktop/windows
        shell: pwsh
        env:
          DECK_WINDOWS_PUBLISHER: ${{ vars.DECK_WINDOWS_PUBLISHER }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = @("release/Fugu-Deck-Setup-$version.exe", "release/win-unpacked/Fugu Deck.exe")
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -ne $env:DECK_WINDOWS_PUBLISHER) {
              throw "Authenticode verification failed for $file: $($signature.Status)"
            }
          }
      - name: Подписанный update manifest
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        shell: bash
        env:
          DECK_UPDATE_PRIVATE_KEY: ${{ secrets.DECK_UPDATE_PRIVATE_KEY }}
          DECK_UPDATE_CHANNEL: ${{ github.event.release.prerelease && 'beta' || 'stable' }}
        run: |
          VERSION=$(cat VERSION)
          MANIFEST=update-windows.json
          if [ "$DECK_UPDATE_CHANNEL" = beta ]; then MANIFEST=update-windows-beta.json; fi
          node scripts/sign-update-manifest.mjs windows "$VERSION" "desktop/windows/release/Fugu-Deck-Setup-${VERSION}.exe" "desktop/windows/release/$MANIFEST" "$DECK_UPDATE_CHANNEL"
      - uses: actions/upload-artifact@v4
        with:
          name: fugu-deck-windows
          path: desktop/windows/release/*.exe
          retention-days: 14
          if-no-files-found: error
      - name: EXE в GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/windows/release/*.exe
            desktop/windows/release/update-windows*.json
          generate_release_notes: true
