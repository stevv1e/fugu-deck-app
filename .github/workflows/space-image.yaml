name: space-image
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths: ["backend/**", ".github/workflows/space-image.yaml"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: space-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4.1.2
        with: {cosign-release: v2.6.5}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; fi
          if [[ $GITHUB_REF == refs/heads/* ]]; then echo "tag=main-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"; fi
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          pull: true
          tags: ghcr.io/${{ steps.owner.outputs.lc }}/deck-space:${{ steps.meta.outputs.tag }}
          provenance: false
      - name: Sign by digest
        run: cosign sign --yes "ghcr.io/${{ steps.owner.outputs.lc }}/deck-space@${{ steps.build.outputs.digest }}"
      - name: Verify signature identity
        run: |
          cosign verify "ghcr.io/${{ steps.owner.outputs.lc }}/deck-space@${{ steps.build.outputs.digest }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/space-image.yaml@${GITHUB_REF}" >/dev/null
          echo "deck-space:${{ steps.meta.outputs.tag }} digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
