# Сборка и подпись APK Fugu Deck. Релизный APK подписывается своим keystore из Actions secrets
# (ANDROID_KEYSTORE_BASE64 + пароли). Отпечаток подписи нужен keyguard (DECK_ANDROID_CERT_SHA256).
name: android
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml", "VERSION"]
  workflow_dispatch: {}
  release: {types: [created]}

permissions: {contents: read}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: [self-hosted, deck]
    timeout-minutes: 120
    env:
      ANDROID_HOME: /opt/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
      - name: ccache
        run: sudo apt-get install -y -qq ccache >/dev/null
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ hashFiles('mobile/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-android-${{ hashFiles('mobile/package-lock.json') }}-
            ccache-android-
      - run: npm ci
        working-directory: mobile
      - name: Версия приложения
        run: |
          echo "DECK_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          echo "DECK_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Нативный проект Android (генерируется из app.json)
        run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      - name: Сборка APK (release)
        working-directory: mobile/android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 1G
          CCACHE_COMPILERCHECK: content
        run: >-
          ./gradlew assembleRelease --no-daemon --stacktrace --build-cache
          -PreactNativeArchitectures=arm64-v8a
          -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=768m" --max-workers=2
          -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease
      - name: Подпись APK своим keystore
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$SIGNER" sign --ks "$RUNNER_TEMP/keystore.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" "$APK"
          "$SIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          { echo '### SHA-256 подписи (для DECK_ANDROID_CERT_SHA256)'; echo '```'; grep -i 'SHA-256' "$RUNNER_TEMP/certs.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          shred -u "$RUNNER_TEMP/keystore.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: fugu-deck-android
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error
      - name: APK в GitHub Release (при теге/релизе)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
