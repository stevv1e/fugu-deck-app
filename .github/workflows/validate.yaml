name: validate
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Public keyguard for cross-checks
        uses: actions/checkout@v7
        with:
          repository: stevv1e/fugu-deck-platform
          path: fugu-deck-platform
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-go@v6
        with: {go-version: "1.26"}
      - name: Backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Real keyguard check handler
        working-directory: fugu-deck-platform/keyguard
        run: go build -o "$RUNNER_TEMP/kgcheck" ./cmd/kgcheck
      - name: Mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts
      - name: Mobile static checks
        working-directory: mobile
        env:
          DECK_KEYGUARD_DIR: ${{ github.workspace }}/fugu-deck-platform/keyguard
        run: |
          npm run typecheck
          npm run lint
          npx tsx tests/vectors.ts --check
      - name: Mobile and keyguard tests
        working-directory: mobile
        env:
          KGCHECK: ${{ runner.temp }}/kgcheck
        run: npm test
      - name: Web export
        working-directory: mobile
        run: npm run web:export
      - name: Windows transport tests
        working-directory: desktop/windows
        run: |
          npm ci
          npm test
