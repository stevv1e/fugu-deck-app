:root {

  --ground: #07060e;
  --surface: #100e1d;
  --surface-2: #171429;
  --line: #262143;
  --ink: #ebe8f7;
  --muted: #918bb0;
  --faint: #5b5677;
  --spark: #fff3c9;
  --stale: #ff5d73;
  --l-dec: #f5a524;
  --l-inf: #4cc9f0;
  --l-code: #a78bfa;
  --l-ppl: #f472b6;
  --l-ops: #34d399;
  --e-part: #6f6a92;
  --e-dep: #c7d2fe;
  --e-dec: #fbbf24;
  --e-con: #ff5d73;
  --e-ex: #5eead4;
  --e-ref: #8f98bd;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;

  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--l-inf); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: 1fr 360px; grid-template-areas: "top top" "chips panel" "stage panel"; }
.top { grid-area: top; display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand small { font-family: var(--f-mono); font-size: 10px; letter-spacing: .18em; color: var(--faint); text-transform: uppercase; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: .01em; }
.brand h1 span { color: var(--muted); font-weight: 500; }
.search { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; min-width: 0; max-width: 420px; margin-left: auto; }

.search input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--ink); font: inherit; padding: 9px 0; outline: none; }
.search input::placeholder { color: var(--faint); }
.stats { font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }

.chips { grid-area: chips; display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; color: var(--muted); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.chip b { font-weight: 500; color: var(--ink); }
.chip small { font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); }
.chip[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); }

.stage { grid-area: stage; position: relative; min-height: 0; overflow: hidden; touch-action: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
canvas.dragging { cursor: grabbing; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 88%, transparent); font-size: 17px; line-height: 1; color: var(--ink); }
.hint { position: absolute; left: 14px; top: 10px; font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); pointer-events: none; }

.panel { grid-area: panel; border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.eyebrow { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 0; }

.section { display: flex; flex-direction: column; gap: 10px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-family: var(--f-mono); font-size: 10.5px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.pill.lobe { color: var(--c); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
.pill.stale { color: var(--stale); border-color: color-mix(in srgb, var(--stale) 50%, var(--line)); }
.pill.fresh { color: var(--l-ops); border-color: color-mix(in srgb, var(--l-ops) 45%, var(--line)); }
.pill.ext { color: var(--e-dec); border-color: color-mix(in srgb, var(--e-dec) 45%, var(--line)); }
.body { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; line-height: 1.55; }
.body code, .log code, .answer code { font-family: var(--f-mono); font-size: 12px; color: var(--e-ex); }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 12.5px; margin: 0; }
.meta dt { color: var(--faint); font-family: var(--f-mono); font-size: 11px; padding-top: 1px; }
.meta dd { margin: 0; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.links { display: flex; flex-direction: column; gap: 4px; }
.link { display: flex; align-items: center; gap: 10px; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; }
.link:hover { background: var(--surface-2); border-color: var(--line); }
.link .ty { flex: none; width: 92px; font-family: var(--f-mono); font-size: 10.5px; color: var(--t); }
.link .nm { flex: 1; min-width: 0; font-size: 13px; }
.link .st { flex: none; width: 34px; height: 3px; border-radius: 2px; background: var(--line); position: relative; overflow: hidden; }
.link .st::after { content: ""; position: absolute; inset: 0; width: var(--s); background: var(--t); }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 12px; font-size: 13px; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.btn > span:first-child { min-width: 0; }
.btn:hover { border-color: var(--muted); }
.btn.primary { border-color: color-mix(in srgb, var(--spark) 40%, var(--line)); }
.btn .k { flex: none; font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); }
.btn.back { padding: 6px 10px; font-size: 12px; align-self: flex-start; }
.log { display: flex; flex-direction: column; gap: 6px; padding: 0; margin: 0; }
.log li { list-style: none; display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 13px; line-height: 1.45; }
.log li::before { content: ""; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--c, var(--spark)); box-shadow: 0 0 10px var(--c, var(--spark)); }
.log li.warn::before { background: var(--stale); box-shadow: 0 0 10px var(--stale); }
.answer { border: 1px solid color-mix(in srgb, var(--spark) 30%, var(--line)); background: color-mix(in srgb, var(--spark) 5%, var(--surface-2)); border-radius: 10px; padding: 12px; line-height: 1.55; display: flex; flex-direction: column; gap: 8px; }
.saving { font-family: var(--f-mono); font-size: 11px; color: var(--l-ops); }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 8px; min-width: 0; }
.legend svg { flex: none; }
.lobes-map { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 12.5px; }
.lobes-map b { font-weight: 500; color: var(--c); font-family: var(--f-mono); font-size: 11px; padding-top: 1px; }
.lobes-map span { color: var(--muted); }
.divider { height: 1px; background: var(--line); }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; grid-template-areas: "top" "chips" "stage" "panel"; }
  .panel { border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; max-height: 40dvh; border-radius: 16px 16px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .stats { display: none; }
  .search { max-width: none; margin-left: 0; }
  .hint { display: none; }
}

    if (n.stale && !dim) { const fl = REDUCED ? .8 : .45 + .45 * Math.abs(Math.sin(t * 3.1 + n.ph)); ctx.strokeStyle = hexA(C("--stale"), fl); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, n.r + 5, 0, 6.29); ctx.stroke(); }
    if (n.ext && !dim) { ctx.strokeStyle = hexA(C("--e-dec"), .85); ctx.lineWidth = 1.1; ctx.setLineDash([1.5, 3]); ctx.beginPath(); ctx.arc(0, 0, n.r + 5, 0, 6.29); ctx.stroke(); ctx.setLineDash([]); }
    if (n === selected) { ctx.strokeStyle = C("--ink"); ctx.lineWidth = 1.3; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.arc(0, 0, n.r + 9, 0, 6.29); ctx.stroke(); ctx.setLineDash([]); }

// ---------- HUD: выноски долей и ЭЭГ ----------
function hud(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const [bl] = toScreen(110, 0), [br] = toScreen(905, 0);
  const lx = bl - 26, rx = br + 26;
  if (lx >= 120 && cw - rx >= 120 && view.s < 2.4) {
    const cnt = (k) => nodes.filter(n => n.lobe === k).length;
    Object.entries(LOBES).forEach(([k, L]) => {
      const col = C(L.c); const [ax, ay] = toScreen(L.ax, L.ay); const left = L.side === "L"; const colX = left ? lx : rx;
      const ly = Math.max(40, Math.min(ch - 140, ay)); const dim = focusLobe && focusLobe !== k;
      ctx.globalAlpha = dim ? .3 : 1;
      ctx.strokeStyle = hexA(col, .45); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(colX + (left ? 14 : -14), ly); ctx.lineTo(colX + (left ? 4 : -4), ly); ctx.stroke();
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(ax, ay, 2.6, 0, 6.29); ctx.fill();
      ctx.strokeStyle = hexA(col, .35 + .25 * Math.sin(t * 2 + ax)); ctx.beginPath(); ctx.arc(ax, ay, 6.5, 0, 6.29); ctx.stroke();
      ctx.textAlign = left ? "right" : "left";
      ctx.font = `500 9.5px ${C("--f-mono")}`; ctx.fillStyle = C("--faint"); ctx.fillText(L.part.toUpperCase(), colX, ly - 9);
      ctx.font = `500 13px ${C("--f-body")}`; ctx.fillStyle = col; ctx.fillText(`${L.name} · ${cnt(k)}`, colX, ly + 7);
      const bw = 64, bx = left ? colX - bw : colX;
      ctx.fillStyle = "rgba(255,255,255,.08)"; ctx.fillRect(bx, ly + 15, bw, 2);
      ctx.fillStyle = col; ctx.fillRect(left ? colX - bw * Math.min(1, lobeAct[k] + .04) : bx, ly + 15, bw * Math.min(1, lobeAct[k] + .04), 2);
      ctx.globalAlpha = 1;
    });
  }
  if (cw >= 600) {
    const w = Math.min(300, cw * .34), rows = Object.keys(LOBES), h = rows.length * 15 + 26, x = 14, y = ch - 14 - h;
    ctx.fillStyle = "rgba(16,14,29,.8)"; ctx.fillRect(x, y, w, h); ctx.strokeStyle = C("--line"); ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
    ctx.textAlign = "left"; ctx.font = `500 9.5px ${C("--f-mono")}`; ctx.fillStyle = C("--faint"); ctx.fillText("ЭЭГ · АКТИВНОСТЬ ДОЛЕЙ", x + 10, y + 15);
    const n = Math.floor(w - 52), x0 = x + 42;
    rows.forEach((k, i) => {
      const L = LOBES[k], col = C(L.c), cy = y + 30 + i * 15;
      const a = lobeAct[k]; const v = (REDUCED ? 0 : (Math.random() - .5) * (.12 + a * 1.6)) + Math.sin(t * 6 + i) * .05 + a * .35;
      const H = eeg[k]; H.push(v); while (H.length > n) H.shift();
      ctx.fillStyle = hexA(col, .85); ctx.font = `500 9px ${C("--f-mono")}`; ctx.fillText(L.short, x + 10, cy + 3);
      ctx.strokeStyle = hexA(col, .3 + Math.min(.6, a)); ctx.lineWidth = 1; ctx.beginPath();
      H.forEach((val, j) => { const px = x0 + j, py = cy - Math.max(-1.1, Math.min(1.1, val)) * 6; j ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.stroke();
    });
  }
}

// ---------- Ввод ----------
const pts = new Map(); let moved = false, pinch0 = null, start = null;
function zoomAt(f, sx, sy) { const [wx, wy] = toWorld(sx, sy); view.s = Math.min(4, Math.max(.4, view.s * f)); view.x = sx - wx * view.s; view.y = sy - wy * view.s; touched = true; }
function pick(sx, sy) { const [wx, wy] = toWorld(sx, sy); let best = null, bd = 1e9; nodes.forEach(n => { const d = Math.hypot(n.x - wx, n.y - wy); if (d < n.r + 10 / view.s && d < bd) { bd = d; best = n; } }); return best; }
cv.addEventListener("pointerdown", (ev) => { cv.setPointerCapture(ev.pointerId); pts.set(ev.pointerId, [ev.offsetX, ev.offsetY]); moved = false; start = [ev.offsetX, ev.offsetY]; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: view.s }; } });
cv.addEventListener("pointermove", (ev) => {
  tiltT = [(ev.offsetX - cw / 2) / cw, (ev.offsetY - ch / 2) / ch];
  if (!pts.has(ev.pointerId)) { hover = pick(ev.offsetX, ev.offsetY); cv.style.cursor = hover ? "pointer" : "grab"; return; }
  const prev = pts.get(ev.pointerId); pts.set(ev.pointerId, [ev.offsetX, ev.offsetY]);
  if (pts.size === 2 && pinch0) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); zoomAt((pinch0.s * d / pinch0.d) / view.s, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); moved = true; return; }
  if (Math.hypot(ev.offsetX - start[0], ev.offsetY - start[1]) > 4) { moved = true; cv.classList.add("dragging"); }
  if (moved) { view.x += ev.offsetX - prev[0]; view.y += ev.offsetY - prev[1]; touched = true; }

cv.addEventListener("wheel", (ev) => { ev.preventDefault(); zoomAt(Math.exp(-ev.deltaY * .0015), ev.offsetX, ev.offsetY); }, { passive: false });
document.getElementById("zin").onclick = () => zoomAt(1.3, cw / 2, ch / 2);
document.getElementById("zout").onclick = () => zoomAt(1 / 1.3, cw / 2, ch / 2);
document.getElementById("zfit").onclick = () => { focusLobe = null; renderChips(); glide(fitView); };
function glide(target) { const from = { ...view }, t0 = performance.now(), dur = REDUCED ? 1 : 450; touched = true;
  (function step(now) { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); view = { s: from.s + (target.s - from.s) * e, x: from.x + (target.x - from.x) * e, y: from.y + (target.y - from.y) * e }; if (k < 1) requestAnimationFrame(step); })(t0); }
const focusOn = (x, y, s) => glide({ s, x: cw / 2 - x * s, y: ch / 2 - y * s });

// ---------- Панель ----------
const panel = document.getElementById("panel");
const esc = (s) => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function ago(d) { if (d === 0) return "сегодня"; if (d === 1) return "вчера"; const w = d % 10 === 1 && d % 100 !== 11 ? "день" : [2, 3, 4].includes(d % 10) && ![12, 13, 14].includes(d % 100) ? "дня" : "дней"; return `${d} ${w} назад`; }
function neuronIcon(col, r, opts = {}) { return `<svg width="24" height="18" viewBox="-12 -9 24 18"><g stroke="${col}" stroke-width=".9" opacity="${opts.o ?? .7}"><path d="M0 0 L-9 -5 M0 0 L9 -4 M0 0 L-7 6 M0 0 L8 6"/></g><circle r="${r}" fill="${col}" opacity="${opts.o ?? 1}"/>${opts.ring ? `<circle r="${r + 3}" fill="none" stroke="${opts.ring}" stroke-width="1.2" ${opts.dash ? 'stroke-dasharray="1.5 3"' : ""}/>` : ""}</svg>`; }

function overview() {
  selected = null;
  panel.innerHTML = `
    <div class="section">
      <p class="eyebrow">Макет · пример данных проекта Shop</p>
      <h2>${nodes.length} заметок, ${edges.length} связей, 5 долей</h2>
      <p class="muted">Нейроны — заметки, аксоны — связи между ними. Внизу слева — ЭЭГ: активность каждой доли. Запустите «мысль агента», чтобы увидеть, по каким заметкам он идёт.</p>
    </div>
    <div class="section">

      <button class="btn primary" data-think="deploy"><span>Можно выкатить фикс оплаты в пятницу?</span><span class="k">Ревьюер</span></button>

        ${Object.values(ETYPES).map(T => `<span><svg width="24" height="12"><line x1="1" y1="6" x2="23" y2="6" stroke="${C(T.c)}" stroke-width="2" ${T.dash ? `stroke-dasharray="${T.dash.join(" ")}"` : ""}/></svg>${T.name}</span>`).join("")}
        <span><svg width="24" height="12"><line x1="1" y1="6" x2="23" y2="6" stroke="${C("--spark")}" stroke-width="1.6" stroke-dasharray="1.5 6"/></svg>бегущий сигнал — сильная связь</span>
      </div>
    </div>

}
function showNote(n) {

    <button class="btn back" id="back">← обзор</button>
    <div class="section">
      <div class="pills">
        <span class="pill lobe" style="--c:${C(L.c)}">${L.name} · ${L.part}</span>
        ${n.stale ? `<span class="pill stale">устарела — источник изменился</span>` : n.days <= 3 ? `<span class="pill fresh">свежая</span>` : n.days > 21 ? `<span class="pill">давно не нужна</span>` : ""}
        ${n.ext ? `<span class="pill ext">из внешнего источника</span>` : ""}
      </div>
      <h2>${esc(n.title)}</h2>

    </div>
    <div class="section">

      <div class="links">${ns.map(e => { const o = e.a === n ? e.b : e.a, T = ETYPES[e.t]; const dir = e.a === n ? T.name : "← " + T.name; return `<button class="link" data-go="${o.id}" style="--t:${C(T.c)};--s:${Math.round(Math.min(1, e.s + e.gain) * 100)}%"><span class="ty">${dir}</span><span class="nm">${esc(o.title)}</span><span class="st" title="сила связи"></span></button>`; }).join("")}</div>

function select(n) { if (thinking) return; selected = n; if (n) { n.act = .7; ripple(n, .7); showNote(n); } else overview(); }

// ---------- Мысль агента ----------
const SCEN = {
  incident: { agent: "Агент «Дежурный»", q: "Почему на checkout снова 502?",
    steps: [["p5", "Запуск: ищу заметки по словам «checkout», «502»"], ["o2", "Похожий инцидент 12.09: шлюз оплаты отвечал 40 с, nginx рвал через 30 с"], ["i9", "Заметка о nginx устарела — конфиг изменился. Перечитываю файл на prod-1", "warn"], ["i8", "prod-1: доступ есть, чтение без подтверждения"], ["o3", "Логи: 37 ошибок <code>payment_error: timeout</code> за час"], ["c3", "Модуль оплаты: 3 ретрая по 10 с — в сумме дольше таймаута nginx"], ["o1", "Runbook: перезапуск не поможет, нужен фикс таймаутов"]],
    answer: "Причина та же, что 12.09: ретраи в <code>payments/checkout.py</code> (3 × 10 с) дольше таймаута nginx (30 с — в конфиге его вернули). Предлагаю уменьшить ретраи до 2 × 8 с и поднять <code>proxy_read_timeout</code> до 45 с. Обновить заметку «nginx на prod-1»?", tokens: [2100, 41000] },
  deploy: { agent: "Агент «Ревьюер»", q: "Можно выкатить фикс оплаты в пятницу?",
    steps: [["p6", "Запуск: ищу решения о деплое для проекта Shop"], ["p4", "Проект Shop: API, фронтенд, prod-1"], ["d4", "Решение: деплой только по вторникам до 16:00"], ["o2", "Противоречие: 12.09 фикс уже выкатывали в пятницу как исключение", "warn"], ["c5", "CI: деплой вручную, тесты e2e ~3 мин"], ["c7", "Тесты e2e покрывают оформление заказа"]],
    answer: "По правилу — нет: деплой только по вторникам. Но 12.09 было исключение для срочного фикса оплаты, и это тот же случай. Если Анна (владелец) подтвердит, выкатывайте после зелёных e2e. Записать правило «срочные фиксы оплаты — исключение» как решение?", tokens: [1500, 26000] },

const edgeBetween = (a, b) => edges.find(e => (e.a === a && e.b === b) || (e.a === b && e.b === a));

  panel.innerHTML = `<div class="section"><p class="eyebrow">${S.agent} · мысль</p><h2>${S.q}</h2></div><ol class="log" id="log"></ol><div id="ans"></div>`;

      li.innerHTML = `<span><b>${esc(n.title)}</b><br><span class="muted">${text}</span></span>`; log.appendChild(li); panel.scrollTop = panel.scrollHeight;

      <span class="saving">прочитано заметок: ${used.length} · ≈ ${tok.toLocaleString("ru-RU")} токенов вместо ≈ ${raw.toLocaleString("ru-RU")} по исходникам (оценка макета)</span>

// ---------- Поиск и доли ----------
const qi = document.getElementById("q");
qi.addEventListener("input", () => { query = qi.value.trim(); });
qi.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { const n = nodes.find(matches); if (n) { select(n); focusOn(n.bx, n.by, Math.max(view.s, 1.6)); } } if (ev.key === "Escape") { qi.value = ""; query = ""; } });

  chips.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const k = b.dataset.lobe;
    if (focusLobe === k) { focusLobe = null; glide(fitView); }
    else { focusLobe = k; const L = nodes.filter(n => n.lobe === k); const xs = L.map(n => n.bx), ys = L.map(n => n.by); const x0 = Math.min(...xs) - 60, x1 = Math.max(...xs) + 60, y0 = Math.min(...ys) - 60, y1 = Math.max(...ys) + 60; focusOn((x0 + x1) / 2, (y0 + y1) / 2, Math.min(cw / (x1 - x0), ch / (y1 - y0), 2.6)); }
    renderChips();
  });
}
document.getElementById("stats").textContent = `${nodes.length} заметок · ${edges.length} связей · ${nodes.filter(n => n.stale).length} устарели`;

window.addEventListener("resize", resize);

})();
