    ctx.fillStyle = hexA("#ffffff", alpha * (.55 + fresh * .4)); ctx.beginPath(); ctx.ellipse(n.x - r * .35, n.y - r * .38, r * .3, r * .2, -.6, 0, 6.29); ctx.fill();
    if (n.stale && !dim) { ctx.strokeStyle = hexA("#2a0b12", .8); ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(n.x - r * .6, n.y - r * .1); ctx.lineTo(n.x - r * .1, n.y + r * .15); ctx.lineTo(n.x + r * .2, n.y - r * .3); ctx.lineTo(n.x + r * .55, n.y + r * .2); ctx.stroke();
      const fl = REDUCED ? .8 : .45 + .45 * Math.abs(Math.sin(t * 3 + n.spoke)); ctx.strokeStyle = hexA(C("--stale"), fl); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(n.x, n.y, r + 5, 0, 6.29); ctx.stroke(); }
    if (n.ext && !dim) { ctx.strokeStyle = hexA(C("--e-dec"), .85); ctx.lineWidth = 1.1; ctx.setLineDash([1.5, 3]); ctx.beginPath(); ctx.arc(n.x, n.y, r + 5, 0, 6.29); ctx.stroke(); ctx.setLineDash([]); }
    if (n === sel) { ctx.strokeStyle = C("--ink"); ctx.lineWidth = 1.3; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.arc(n.x, n.y, r + 9, 0, 6.29); ctx.stroke(); ctx.setLineDash([]); }
    n.act = Math.max(0, n.act - .007);
  });

  drawSpider(t);

  // подписи
  ctx.textAlign = "left"; ctx.textBaseline = "middle"; const fs = 11.5 / view.s; ctx.font = `500 ${fs}px ${C("--f-body")}`;
  nodes.forEach(n => {
    const dim = isDim(n);
    const show = n === sel || n === hover || n.act > .45 || n === hub || (!dim && (view.s > 1.15 || (n.r > 7.6 && view.s > .5) || (sel && !dim) || (query && matches(n))));
    if (!show) return;
    const tx = n.x + n.r + 6 / view.s, ty = n.y + (n === hub ? 18 : 0), w = ctx.measureText(n.title).width;
    ctx.fillStyle = "rgba(5,6,11,.74)"; ctx.fillRect(tx - 3 / view.s, ty - fs * .75, w + 6 / view.s, fs * 1.5);
    ctx.fillStyle = dim ? C("--faint") : n.days > 21 ? C("--muted") : C("--ink"); ctx.fillText(n.title, tx, ty);
  });
  ctx.textBaseline = "alphabetic";

  if (!REDUCED && !thinking && Math.random() < .006) { const n = nodes[(Math.random() * nodes.length) | 0]; waves.push({ x: n.x, y: n.y, t0: t, amp: 1.2 }); }
  requestAnimationFrame(draw);
}

// ---------- Ввод ----------
const pts = new Map(); let moved = false, pinch0 = null, start = null;
function zoomAt(f, sx, sy) { const [wx, wy] = toWorld(sx, sy); view.s = Math.min(4.5, Math.max(.3, view.s * f)); view.x = sx - wx * view.s; view.y = sy - wy * view.s; touched = true; }
function pick(sx, sy) { const [wx, wy] = toWorld(sx, sy); let best = null, bd = 1e9; nodes.forEach(n => { const d = Math.hypot(n.x - wx, n.y - wy); if (d < n.r + 10 / view.s && d < bd) { bd = d; best = n; } }); return best; }
cv.addEventListener("pointerdown", (ev) => { cv.setPointerCapture(ev.pointerId); pts.set(ev.pointerId, [ev.offsetX, ev.offsetY]); moved = false; start = [ev.offsetX, ev.offsetY]; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: view.s }; } });
cv.addEventListener("pointermove", (ev) => {
  if (!pts.has(ev.pointerId)) { hover = pick(ev.offsetX, ev.offsetY); cv.style.cursor = hover ? "pointer" : "grab"; return; }
  const prev = pts.get(ev.pointerId); pts.set(ev.pointerId, [ev.offsetX, ev.offsetY]);
  if (pts.size === 2 && pinch0) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); zoomAt((pinch0.s * d / pinch0.d) / view.s, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); moved = true; return; }
  if (Math.hypot(ev.offsetX - start[0], ev.offsetY - start[1]) > 4) { moved = true; cv.classList.add("dragging"); }
  if (moved) { view.x += ev.offsetX - prev[0]; view.y += ev.offsetY - prev[1]; touched = true; }

  if (!moved && pts.size === 0) { const n = pick(ev.offsetX, ev.offsetY); if (!n && !thinking) { const [wx, wy] = toWorld(ev.offsetX, ev.offsetY); if (Math.hypot(wx - CX, wy - CY) < 400) waves.push({ x: wx, y: wy, t0: performance.now() / 1000, amp: 3 }); } select(n); } });

cv.addEventListener("wheel", (ev) => { ev.preventDefault(); zoomAt(Math.exp(-ev.deltaY * .0015), ev.offsetX, ev.offsetY); }, { passive: false });
document.getElementById("zin").onclick = () => zoomAt(1.3, cw / 2, ch / 2);
document.getElementById("zout").onclick = () => zoomAt(1 / 1.3, cw / 2, ch / 2);
document.getElementById("zfit").onclick = () => { focusDom = null; renderChips(); glide(fitView); };
function glide(target) { const from = { ...view }, t0 = performance.now(), dur = REDUCED ? 1 : 450; touched = true;

const focusOn = (x, y, s) => glide({ s, x: cw / 2 - x * s, y: ch / 2 - y * s });

// ---------- Панель ----------
const panel = document.getElementById("panel");
const esc = (s) => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function ago(d) { if (d === 0) return "сегодня"; if (d === 1) return "вчера"; const w = d % 10 === 1 && d % 100 !== 11 ? "день" : [2, 3, 4].includes(d % 10) && ![12, 13, 14].includes(d % 100) ? "дня" : "дней"; return `${d} ${w} назад`; }
function dropIcon(col, opts = {}) { return `<svg width="22" height="18" viewBox="-11 -9 22 18"><circle r="${opts.r ?? 5}" fill="${opts.fill ?? "rgba(223,232,255,.45)"}" stroke="${col}" stroke-width="1.2" opacity="${opts.o ?? 1}"/><ellipse cx="-1.8" cy="-2" rx="1.6" ry="1" fill="#fff" opacity="${opts.o ?? 1}"/>${opts.ring ? `<circle r="8" fill="none" stroke="${opts.ring}" stroke-width="1.2" ${opts.dash ? 'stroke-dasharray="1.5 3"' : ""}/>` : ""}</svg>`; }
function overview() {
  selected = null;
  panel.innerHTML = `
    <div class="section">
      <p class="eyebrow">Макет · пример данных проекта Shop</p>
      <h2>${nodes.length - 1} капель-заметок на ${NS} спицах</h2>
      <p class="muted">Паук — это агент. Когда он касается заметки, паутина вибрирует, и связанные заметки откликаются. Нажмите на пустое место паутины — она дрогнет.</p>
    </div>
    <div class="section">
      <p class="eyebrow">Мысль агента</p>

      <button class="btn primary" data-think="deploy"><span>Можно выкатить фикс оплаты в пятницу?</span><span class="k">Ревьюер</span></button>
    </div>
    <div class="divider"></div>
    <div class="section">
      <p class="eyebrow">Как устроена паутина</p>

        <b>центр</b><span>проект Shop; здесь паук ждёт задачу</span>
        <b>секторы</b><span>области: решения, инфраструктура, код, операции, люди и агенты; одна спица — одна заметка</span>
        <b>капли</b><span>заметки; кольцо — цвет сектора, размер — важность</span>
        <b>витки</b><span>давность: ближе к центру — свежие и важные, на краю — давно не нужные</span>
        <b>нити поперёк</b><span>связи между заметками (${chords.length}); цвет — тип</span>
        <b>якоря</b><span>источники: документы, чаты, репозитории, сервер. Касание капли показывает путь к её источнику</span>

        ${Object.entries(ETYPES).filter(([k]) => k !== "part").map(([, T]) => `<span><svg width="22" height="12"><line x1="1" y1="6" x2="21" y2="6" stroke="${C(T.c)}" stroke-width="2" ${T.dash ? `stroke-dasharray="${T.dash.join(" ")}"` : ""}/></svg>${T.name}</span>`).join("")}
        <span><svg width="22" height="12"><line x1="1" y1="3" x2="21" y2="3" stroke="${C("--e-ref")}" stroke-width=".7"/><line x1="1" y1="9" x2="21" y2="9" stroke="${C("--e-ref")}" stroke-width="2.6"/></svg>толщина — сила связи</span>
      </div>
    </div>`;
  panel.querySelectorAll("[data-think]").forEach(b => b.onclick = () => think(b.dataset.think));
}
function showNote(n) {

function select(n) { if (thinking) return; selected = n; if (n) { n.act = .6; waves.push({ x: n.x, y: n.y, t0: performance.now() / 1000, amp: 2 }); showNote(n); } else overview(); }

// ---------- Мысль агента: паук ----------
const SCEN = {
  incident: { agent: "Агент «Дежурный»", q: "Почему на checkout снова 502?",
    steps: [["p5", "Запуск: ищу заметки по словам «checkout», «502»"], ["o2", "Похожий инцидент 12.09: шлюз оплаты отвечал 40 с, nginx рвал через 30 с"], ["i9", "Заметка о nginx устарела — нить порвана. Перечитываю файл на prod-1", "warn"], ["i8", "prod-1: доступ есть, чтение без подтверждения"], ["o3", "Логи: 37 ошибок <code>payment_error: timeout</code> за час"], ["c3", "Модуль оплаты: 3 ретрая по 10 с — в сумме дольше таймаута nginx"], ["o1", "Runbook: перезапуск не поможет, нужен фикс таймаутов"]],
    answer: "Причина та же, что 12.09: ретраи в <code>payments/checkout.py</code> (3 × 10 с) дольше таймаута nginx (30 с — в конфиге его вернули). Предлагаю уменьшить ретраи до 2 × 8 с и поднять <code>proxy_read_timeout</code> до 45 с. Обновить заметку «nginx на prod-1»?", tokens: [2100, 41000] },
  deploy: { agent: "Агент «Ревьюер»", q: "Можно выкатить фикс оплаты в пятницу?",
    steps: [["p6", "Запуск: ищу решения о деплое для проекта Shop"], ["p4", "Проект Shop: API, фронтенд, prod-1"], ["d4", "Решение: деплой только по вторникам до 16:00"], ["o2", "Противоречие: 12.09 фикс уже выкатывали в пятницу как исключение", "warn"], ["c5", "CI: деплой вручную, тесты e2e ~3 мин"], ["c7", "Тесты e2e покрывают оформление заказа"]],
    answer: "По правилу — нет: деплой только по вторникам. Но 12.09 было исключение для срочного фикса оплаты, и это тот же случай. Если Анна (владелец) подтвердит, выкатывайте после зелёных e2e. Записать правило «срочные фиксы оплаты — исключение» как решение?", tokens: [1500, 26000] },
};
function think(key) {
  if (thinking) return;
  const S = SCEN[key]; thinking = true; selected = null; focusDom = null; query = ""; qi.value = ""; renderChips(); glide(fitView);
  panel.innerHTML = `<div class="section"><p class="eyebrow">${S.agent} · мысль</p><h2>${S.q}</h2></div><ol class="log" id="log"></ol><div id="ans"></div>`;

    };
  };

  const finish = () => {
    let grown = 0;
    for (let a = 0; a < used.length; a++) for (let b = a + 1; b < used.length; b++) { const e = edges.find(x => (x.a === used[a] && x.b === used[b]) || (x.a === used[b] && x.b === used[a])); if (e) { e.gain = Math.min(.4, e.gain + .12); e.pulse = .8; grown++; } }
    used.forEach(n => n.days = 0);
    const [tok, raw] = S.tokens;
    document.getElementById("ans").innerHTML = `<div class="answer"><p class="eyebrow">Ответ</p><p>${S.answer}</p>
      <span class="saving">прочитано заметок: ${used.length} · ≈ ${tok.toLocaleString("ru-RU")} токенов вместо ≈ ${raw.toLocaleString("ru-RU")} по исходникам (оценка макета)</span>
      <span class="saving">усилено связей: ${grown} · использованные заметки снова свежие</span></div><button class="btn back" id="done" style="margin-top:12px">← обзор</button>`;
    panel.scrollTop = panel.scrollHeight; document.getElementById("done").onclick = overview; thinking = false;
  };
  setTimeout(next, 300);
}

// ---------- Поиск и секторы ----------
const qi = document.getElementById("q");
qi.addEventListener("input", () => { query = qi.value.trim(); });
qi.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { const n = nodes.find(matches); if (n) { select(n); focusOn(n.x, n.y, Math.max(view.s, 1.4)); } } if (ev.key === "Escape") { qi.value = ""; query = ""; } });
const chipsEl = document.getElementById("chips");

document.getElementById("stats").textContent = `${nodes.length} заметок · ${edges.length} связей · ${nodes.filter(n => n.stale).length} устарели`;

window.addEventListener("resize", resize);
updateWeb(0); resize(); renderChips(); overview(); requestAnimationFrame(draw);
})();
