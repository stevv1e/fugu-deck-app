<title>Древо знаний Fugu Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen app — top bar with species switch, branch chips, canvas tree fills the stage,
   note panel docks right (desktop) or as a bottom sheet (phone). Single night look by choice; the accent follows the chosen tree. */
:root {
  color-scheme: dark;
  --ground: #0b0a16;
  --surface: #111020;
  --surface-2: #181629;
  --line: #27233f;
  --ink: #eeeaf5;
  --muted: #958fae;
  --faint: #5f5a78;
  --accent: #f7a8c8;
  --spark: #fff4d1;
  --stale: #ff5d73;
  --rust: #d9622b;
  --d-dec: #f5a524;
  --d-inf: #4cc9f0;
  --d-code: #a78bfa;
  --d-ppl: #f472b6;
  --d-ops: #34d399;
  --e-dep: #c7d2fe;
  --e-dec: #fbbf24;
  --e-con: #ff5d73;
  --e-ex: #5eead4;
  --e-ref: #9aa3c7;
  --f-display: "Shippori Mincho", "Noto Serif JP", Georgia, serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: 1fr 360px; grid-template-areas: "top top" "chips panel" "stage panel"; }
.top { grid-area: top; display: flex; align-items: center; gap: 12px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; margin-right: auto; }
.brand small { font-family: var(--f-mono); font-size: 10px; letter-spacing: .18em; color: var(--faint); text-transform: uppercase; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: .02em; }
.brand h1 span { color: var(--accent); font-weight: 600; }
.species { min-width: 0; display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.species button { border: 0; background: transparent; padding: 6px 10px; border-radius: 7px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.species button span { font-family: var(--f-display); font-size: 13px; margin-right: 4px; color: var(--faint); }
.species button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
.species button[aria-pressed="true"] span { color: var(--accent); }
.search { flex: 0 1 300px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; min-width: 0; }
.search svg { flex: none; color: var(--faint); }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--ink); font: inherit; padding: 9px 0; outline: none; }
.search input::placeholder { color: var(--faint); }

.chips { grid-area: chips; display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; color: var(--muted); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip b { font-weight: 500; color: var(--ink); }
.chip small { font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); }
.chip[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); }

.stage { grid-area: stage; position: relative; min-height: 0; overflow: hidden; touch-action: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
canvas.dragging { cursor: grabbing; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 88%, transparent); font-size: 17px; line-height: 1; }
.hint { position: absolute; left: 12px; top: 10px; font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); pointer-events: none; }

.panel { grid-area: panel; border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.eyebrow { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 0; }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 19px; line-height: 1.3; text-wrap: balance; }
.panel p { margin: 0; line-height: 1.55; }
.muted { color: var(--muted); }
.section { display: flex; flex-direction: column; gap: 10px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-family: var(--f-mono); font-size: 10.5px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.pill.dom { color: var(--c); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
.pill.stale { color: var(--stale); border-color: color-mix(in srgb, var(--stale) 50%, var(--line)); }
.pill.fresh { color: var(--d-ops); border-color: color-mix(in srgb, var(--d-ops) 45%, var(--line)); }
.pill.ext { color: var(--e-dec); border-color: color-mix(in srgb, var(--e-dec) 45%, var(--line)); }
.body { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; line-height: 1.55; }
.body code, .log code, .answer code { font-family: var(--f-mono); font-size: 12px; color: var(--e-ex); }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 12.5px; margin: 0; }
.meta dt { color: var(--faint); font-family: var(--f-mono); font-size: 11px; padding-top: 1px; }
.meta dd { margin: 0; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.links { display: flex; flex-direction: column; gap: 4px; }
.link { display: flex; align-items: center; gap: 10px; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; }
.link:hover { background: var(--surface-2); border-color: var(--line); }
.link .ty { flex: none; width: 92px; font-family: var(--f-mono); font-size: 10.5px; color: var(--t); }
.link .nm { flex: 1; min-width: 0; font-size: 13px; }
.link .st { flex: none; width: 34px; height: 3px; border-radius: 2px; background: var(--line); position: relative; overflow: hidden; }
.link .st::after { content: ""; position: absolute; inset: 0; width: var(--s); background: var(--t); }
.btn > span:first-child { min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 12px; font-size: 13px; text-align: left; display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.btn:hover { border-color: var(--muted); }
.btn.primary { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.btn .k { font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); flex: none; }
.btn.back { padding: 6px 10px; font-size: 12px; align-self: flex-start; }
.log { display: flex; flex-direction: column; gap: 6px; padding: 0; margin: 0; }
.log li { list-style: none; display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 13px; line-height: 1.45; }
.log li::before { content: ""; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--c, var(--spark)); box-shadow: 0 0 10px var(--c, var(--spark)); }
.log li.warn::before { background: var(--stale); box-shadow: 0 0 10px var(--stale); }
.answer { border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); background: color-mix(in srgb, var(--accent) 5%, var(--surface-2)); border-radius: 10px; padding: 12px; line-height: 1.55; display: flex; flex-direction: column; gap: 8px; }
.saving { font-family: var(--f-mono); font-size: 11px; color: var(--d-ops); }
.map { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; font-size: 12.5px; }
.map b { font-weight: 600; font-family: var(--f-display); font-size: 13.5px; color: var(--accent); }
.map span { color: var(--muted); }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 8px; min-width: 0; }
.legend svg { flex: none; }
.divider { height: 1px; background: var(--line); }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; grid-template-areas: "top" "chips" "stage" "panel"; }
  .panel { border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; max-height: 40dvh; border-radius: 16px 16px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .brand { margin-right: 0; flex: 1 1 100%; }
  .species { flex: 1 1 100%; overflow-x: auto; scrollbar-width: none; }
  .species button { flex: 1; }
  .search { flex: 1 1 100%; }
  .hint { display: none; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <small>Fugu Deck · пространство Shop</small>
      <h1>Древо знаний <span id="spname">· Сакура</span></h1>
    </div>
    <div class="species" id="species" role="group" aria-label="Вид дерева"></div>
    <label class="search" for="q">

      <input id="q" type="search" placeholder="Найти заметку: prod-1, деплой, OpenBao…" autocomplete="off">
    </label>

  <nav class="chips" id="chips" aria-label="Ветви"></nav>
  <main class="stage" id="stage">

  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

function renderSpecies() {
  spBox.innerHTML = Object.entries(SPECIES).map(([k, S]) => `<button data-sp="${k}" aria-pressed="${k === spKey}"><span>${S.kanji}</span>${S.name}</button>`).join("");
  spBox.querySelectorAll("button").forEach(b => b.onclick = () => { spKey = b.dataset.sp; SP = SPECIES[spKey]; try { localStorage.setItem("fd-tree-species", spKey); } catch (e) {} applySpecies(); });
}
function applySpecies() { root.style.setProperty("--accent", SP.accent); document.getElementById("spname").textContent = "· " + SP.name; renderSpecies(); petals.length = 0; if (!thinking) { selected ? showNote(selected) : overview(); } }

window.addEventListener("resize", resize);
resize(); renderChips(); applySpecies(); requestAnimationFrame(draw);
})();
</script>
