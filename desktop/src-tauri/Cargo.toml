[package]
name = "fugu-deck"
version = "0.0.0"
edition = "2021"
description = "Fugu Deck для Windows"
publish = false

[lib]
name = "fugu_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
mime_guess = "2"
once_cell = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging",
  "Security_Credentials_UI", "Foundation",
] }

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
