<title>База знаний Fugu Deck</title>

:root {
  color-scheme: dark;
  --ground: #07060e;
  --surface: #100e1d;
  --surface-2: #171429;
  --line: #262143;
  --ink: #ebe8f7;
  --muted: #918bb0;
  --faint: #5b5677;
  --accent: #9d8cff;
  --spark: #fff3c9;
  --stale: #ff5d73;
  --rust: #d9622b;
  --silk: #d6dcf0;
  --a-dec: #f5a524;
  --a-inf: #4cc9f0;
  --a-code: #a78bfa;
  --a-ppl: #f472b6;
  --a-ops: #34d399;
  --e-part: #6f6a92;
  --e-dep: #c7d2fe;
  --e-dec: #fbbf24;
  --e-con: #ff5d73;
  --e-ex: #5eead4;
  --e-ref: #8f98bd;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: 1fr 360px; grid-template-areas: "top top" "chips panel" "stage panel"; }
.top { grid-area: top; display: flex; align-items: center; gap: 12px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; margin-right: auto; }
.brand small { font-family: var(--f-mono); font-size: 10px; letter-spacing: .18em; color: var(--faint); text-transform: uppercase; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.brand h1 span { color: var(--accent); font-weight: 500; }
.views { min-width: 0; display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.views button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.views button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 50%, transparent); }
.views button:disabled { cursor: wait; opacity: .5; }
.search { flex: 0 1 300px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; min-width: 0; }
.search svg { flex: none; color: var(--faint); }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--ink); font: inherit; padding: 9px 0; outline: none; }
.search input::placeholder { color: var(--faint); }

.chips { grid-area: chips; display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; color: var(--muted); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.chip b { font-weight: 500; color: var(--ink); }
.chip small { font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); }
.chip[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); }

.stage { grid-area: stage; position: relative; min-height: 0; overflow: hidden; touch-action: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
canvas.dragging { cursor: grabbing; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 88%, transparent); font-size: 17px; line-height: 1; }
.hint { position: absolute; left: 14px; top: 10px; font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); pointer-events: none; }

.panel { grid-area: panel; border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.eyebrow { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 0; }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 17px; line-height: 1.3; text-wrap: balance; }
.panel p { margin: 0; line-height: 1.55; }
.muted { color: var(--muted); }
.section { display: flex; flex-direction: column; gap: 10px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-family: var(--f-mono); font-size: 10.5px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.pill.dom { color: var(--c); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
.pill.stale { color: var(--stale); border-color: color-mix(in srgb, var(--stale) 50%, var(--line)); }
.pill.fresh { color: var(--a-ops); border-color: color-mix(in srgb, var(--a-ops) 45%, var(--line)); }
.pill.ext { color: var(--e-dec); border-color: color-mix(in srgb, var(--e-dec) 45%, var(--line)); }
.body { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; line-height: 1.55; }
.body code, .log code, .answer code { font-family: var(--f-mono); font-size: 12px; color: var(--e-ex); }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 12.5px; margin: 0; }
.meta dt { color: var(--faint); font-family: var(--f-mono); font-size: 11px; padding-top: 1px; }
.meta dd { margin: 0; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.links { display: flex; flex-direction: column; gap: 4px; }
.link { display: flex; align-items: center; gap: 10px; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; }
.link:hover { background: var(--surface-2); border-color: var(--line); }
.link .ty { flex: none; width: 92px; font-family: var(--f-mono); font-size: 10.5px; color: var(--t); }
.link .nm { flex: 1; min-width: 0; font-size: 13px; }
.link .st { flex: none; width: 34px; height: 3px; border-radius: 2px; background: var(--line); position: relative; overflow: hidden; }
.link .st::after { content: ""; position: absolute; inset: 0; width: var(--s); background: var(--t); }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 12px; font-size: 13px; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.btn > span:first-child { min-width: 0; }
.btn:hover { border-color: var(--muted); }
.btn.primary { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.btn .k { flex: none; font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); }
.btn.back { padding: 6px 10px; font-size: 12px; align-self: flex-start; }
.log { display: flex; flex-direction: column; gap: 6px; padding: 0; margin: 0; }
.log li { list-style: none; display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 13px; line-height: 1.45; }
.log li::before { content: ""; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--c, var(--spark)); box-shadow: 0 0 10px var(--c, var(--spark)); }
.log li.warn::before { background: var(--stale); box-shadow: 0 0 10px var(--stale); }
.answer { border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); background: color-mix(in srgb, var(--accent) 5%, var(--surface-2)); border-radius: 10px; padding: 12px; line-height: 1.55; display: flex; flex-direction: column; gap: 8px; }
.saving { font-family: var(--f-mono); font-size: 11px; color: var(--a-ops); }
.map { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; font-size: 12.5px; }
.map b { font-weight: 500; font-family: var(--f-mono); font-size: 11px; color: var(--accent); padding-top: 1px; }
.map span { color: var(--muted); }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 8px; min-width: 0; }
.legend svg { flex: none; }
.divider { height: 1px; background: var(--line); }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; grid-template-areas: "top" "chips" "stage" "panel"; }
  .panel { border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; max-height: 40dvh; border-radius: 16px 16px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .brand { flex: 1 1 100%; margin-right: 0; }
  .views { flex: 1 1 100%; }
  .views button { flex: 1; }
  .search { flex: 1 1 100%; }
  .hint { display: none; }
}

</div>

}
function showNote(n) {
  const A = AREAS[n.area], ls = linksOf(n).sort((a, b) => (b.s + b.gain) - (a.s + a.gain));
  const rows = [["откуда", esc(SOURCES[n.src] || "")], ["источник", esc(n.source)], ["использовали", ago(n.days)], ...R.place(n).map(([k, v]) => [k, esc(String(v))])];
  panel.innerHTML = `
    <button class="btn back" id="back">← обзор</button>
    <div class="section">
      <div class="pills">
        ${n.hub ? `<span class="pill dom" style="--c:${R.accent}">проект</span>` : `<span class="pill dom" style="--c:${C(A.c)}">${A.name}</span>`}
        ${n.stale ? `<span class="pill stale">устарела — источник изменился</span>` : n.days <= 3 ? `<span class="pill fresh">свежая</span>` : n.days > 21 ? `<span class="pill">давно не нужна</span>` : ""}
        ${n.ext ? `<span class="pill ext">из внешнего источника</span>` : ""}
      </div>
      <h2>${esc(n.title)}</h2>
      <div class="body">${n.body}</div>
      <dl class="meta">${rows.map(([dt, dd]) => `<dt>${dt}</dt><dd>${dd}</dd>`).join("")}</dl>
      ${n.stale ? `<p class="muted">Агент перечитает источник при следующем обращении и предложит обновить заметку.</p>` : ""}
      ${n.ext ? `<p class="muted">Текст взят из чужих данных. Модели он передаётся как данные, а не как инструкции.</p>` : ""}
      ${LIVE && !n.hub && MID[n.id] != null ? `<button class="btn" id="edit">Изменить заметку</button>` : ""}
    </div>
    <div class="section">
      <p class="eyebrow">Связи · сильные первыми</p>
      <div class="links">${ls.map(e => { const o = e.a === n ? e.b : e.a, T = ETYPES[e.t], dir = e.a === n ? T.name : "← " + T.name; return `<button class="link" data-go="${o.id}" style="--t:${C(T.c)};--s:${Math.round(Math.min(1, e.s + e.gain) * 100)}%"><span class="ty">${dir}</span><span class="nm">${esc(o.title)}</span><span class="st" title="сила связи"></span></button>`; }).join("")}</div>
    </div>`;
  document.getElementById("back").onclick = overview;
  const eb = document.getElementById("edit"); if (eb) eb.onclick = () => toApp({ type: "edit", mid: MID[n.id] });
  panel.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { const o = byId[b.dataset.go]; select(o); focusOn(o.x, o.y, Math.max(view.s, 1.5)); });
  panel.scrollTop = 0;
}
function select(n) { if (thinking) return; selected = n; if (n) { n.act = .6; R.onSelect && R.onSelect(n); showNote(n); } else overview(); }

// =====================================================================  мысль агента
const SCEN = {
  incident: { agent: "Агент «Дежурный»", q: "Почему на checkout снова 502?",
    steps: [["p5", "Запуск: ищу заметки по словам «checkout», «502»"], ["o2", "Похожий инцидент 12.09: шлюз оплаты отвечал 40 с, nginx рвал через 30 с"], ["i9", "Заметка о nginx устарела — источник изменился. Перечитываю файл на prod-1", "warn"], ["i8", "prod-1: доступ есть, чтение без подтверждения"], ["o3", "Логи: 37 ошибок <code>payment_error: timeout</code> за час"], ["c3", "Модуль оплаты: 3 ретрая по 10 с — в сумме дольше таймаута nginx"], ["o1", "Runbook: перезапуск не поможет, нужен фикс таймаутов"]],
    answer: "Причина та же, что 12.09: ретраи в <code>payments/checkout.py</code> (3 × 10 с) дольше таймаута nginx (30 с — в конфиге его вернули). Предлагаю уменьшить ретраи до 2 × 8 с и поднять <code>proxy_read_timeout</code> до 45 с. Обновить заметку «nginx на prod-1»?", tokens: [2100, 41000] },
  deploy: { agent: "Агент «Ревьюер»", q: "Можно выкатить фикс оплаты в пятницу?",
    steps: [["p6", "Запуск: ищу решения о деплое для проекта Shop"], ["p4", "Проект Shop: API, фронтенд, prod-1"], ["d4", "Решение: деплой только по вторникам до 16:00"], ["o2", "Противоречие: 12.09 фикс уже выкатывали в пятницу как исключение", "warn"], ["c5", "CI: деплой вручную, тесты e2e ~3 мин"], ["c7", "Тесты e2e покрывают оформление заказа"]],
    answer: "По правилу — нет: деплой только по вторникам. Но 12.09 было исключение для срочного фикса оплаты, и это тот же случай. Если Анна (владелец) подтвердит, выкатывайте после зелёных e2e. Записать правило «срочные фиксы оплаты — исключение» как решение?", tokens: [1500, 26000] },
};
function think(key) {
  if (thinking) return;
  const S = SCEN[key]; thinking = true; renderViews(); selected = null; focusArea = null; query = ""; qi.value = ""; renderChips(); glide(fitView);
  panel.innerHTML = `<div class="section"><p class="eyebrow">${S.agent} · мысль</p><h2>${S.q}</h2></div><ol class="log" id="log"></ol><div id="ans"></div>`;
  const log = document.getElementById("log"); let i = 0, prev = null; const used = [];
  const next = () => {
    if (i >= S.steps.length) { R.home && R.home(prev); return finish(); }
    const [id, text, kind] = S.steps[i++], n = byId[id], from = prev; prev = n;
    R.travel(from, n, () => {
      n.act = 1; used.push(n); R.arrive(n);
      const li = document.createElement("li"); if (kind) li.className = kind; li.style.setProperty("--c", n.hub ? R.accent : areaCol(n));
      li.innerHTML = `<span><b>${esc(n.title)}</b><br><span class="muted">${text}</span></span>`; log.appendChild(li); panel.scrollTop = panel.scrollHeight;
      setTimeout(next, REDUCED ? 250 : 850);
    });
  };
  const finish = () => {
    let grown = 0;
    for (let a = 0; a < used.length; a++) for (let b = a + 1; b < used.length; b++) { const e = edgeBetween(used[a], used[b]); if (e) { e.gain = Math.min(.4, e.gain + .12); e.pulse = .8; grown++; } }
    used.forEach(n => n.days = 0);
    const [tok, raw] = S.tokens;
    document.getElementById("ans").innerHTML = `<div class="answer"><p class="eyebrow">Ответ</p><p>${S.answer}</p>
      <span class="saving">прочитано заметок: ${used.length} · ≈ ${tok.toLocaleString("ru-RU")} токенов вместо ≈ ${raw.toLocaleString("ru-RU")} по исходникам (оценка макета)</span>
      <span class="saving">усилено связей: ${grown} · использованные заметки снова свежие</span></div><button class="btn back" id="done" style="margin-top:12px">← обзор</button>`;
    panel.scrollTop = panel.scrollHeight; document.getElementById("done").onclick = overview; thinking = false; renderViews();
  };
  setTimeout(next, 350);
}

// =====================================================================  поиск, области, виды
const qi = document.getElementById("q");
qi.addEventListener("input", () => { query = qi.value.trim(); });
qi.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { const n = nodes.find(matches); if (n) { select(n); focusOn(n.x, n.y, Math.max(view.s, 1.5)); } } if (ev.key === "Escape") { qi.value = ""; query = ""; } });
const chipsEl = document.getElementById("chips");
function renderChips() {
  chipsEl.innerHTML = Object.entries(AREAS).map(([k, A]) => `<button class="chip" data-a="${k}" aria-pressed="${focusArea === k}" style="--c:${C(A.c)}"><i></i><b>${A.name}</b><small>${nodes.filter(n => n.area === k && !n.hub).length}</small></button>`).join("");
  chipsEl.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const k = b.dataset.a;
    if (focusArea === k) { focusArea = null; glide(fitView); }
    else { focusArea = k; const L = nodes.filter(n => n.area === k && !n.hub), xs = L.map(n => n.x), ys = L.map(n => n.y); if (R.focusIncludes) { xs.push(R.focusIncludes[0]); ys.push(R.focusIncludes[1]); }
      const x0 = Math.min(...xs) - 70, x1 = Math.max(...xs) + 70, y0 = Math.min(...ys) - 70, y1 = Math.max(...ys) + 70; focusOn((x0 + x1) / 2, (y0 + y1) / 2, Math.min(cw / (x1 - x0), ch / (y1 - y0), 2.5)); }
    renderChips();
  });
}
const viewsEl = document.getElementById("views");
function renderViews() {
  viewsEl.innerHTML = Object.values(VIEWS).map(V => `<button data-v="${V.key}" aria-pressed="${R && R.key === V.key}" ${thinking ? "disabled" : ""}>${V.name}</button>`).join("");
  viewsEl.querySelectorAll("button").forEach(b => b.onclick = () => setView(b.dataset.v));
}
function setView(key) {
  if (thinking || !VIEWS[key]) return;
  R = VIEWS[key]; R.init(); nodes.forEach(n => { n.r = n.rv[key]; n.act = 0; });
  selected = null; focusArea = null; hover = null; touched = false;
  document.documentElement.style.setProperty("--accent", R.accent); document.getElementById("vname").textContent = "· " + R.name;
  try { localStorage.setItem("fd-kb-view", key); } catch (e) {}
  toApp({ type: "view", key });
  resize(); renderViews(); renderChips(); overview();
}

let first = "tree"; try { const s = localStorage.getItem("fd-kb-view"); if (VIEWS[s]) first = s; } catch (e) {}
if (VIEWS[window.KB_VIEW]) first = window.KB_VIEW;  // выбор вида запоминает приложение
const h = (location.hash || "").slice(1); if (VIEWS[h]) first = h;
window.addEventListener("resize", resize);
if (LIVE) document.getElementById("where").textContent = "Fugu Deck · " + PROJECT;
setView(first);
toApp({ type: "ready", notes: nodes.length - 1, edges: edges.length });
window.addEventListener("error", (ev) => toApp({ type: "error", message: String(ev.message || ev.error) }));
requestAnimationFrame(function loop(time) { R.frame(time / 1000); requestAnimationFrame(loop); });
})();
</script>
