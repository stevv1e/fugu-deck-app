# Корневое приложение Argo CD (app-of-apps). Применяется один раз вручную:
#   kubectl apply -n argocd -f infra/bootstrap/root-app.yaml
# Дальше всё, что лежит в infra/apps/, Argo CD разворачивает и обновляет сам из git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deck-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_LOGIN/fugu-deck.git   # ← ваш репозиторий
    targetRevision: main
    path: infra/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
