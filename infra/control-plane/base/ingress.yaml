# Приложение (PWA) и API control-plane. Пространства получают свои маршруты /s/<id>/ от оператора.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: deck-tls }
spec:
  secretName: deck-tls
  issuerRef: { name: letsencrypt, kind: ClusterIssuer }
  dnsNames: [deck.example.kz]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: security-headers }
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
    contentSecurityPolicy: "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: redirect-https }
spec:
  redirectScheme: { scheme: https, permanent: true }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: control-plane }
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`deck.example.kz`)
      kind: Rule
      middlewares: [{ name: security-headers }]
      services: [{ name: control-plane, port: 8080 }]
  tls: { secretName: deck-tls }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: control-plane-http }
spec:
  entryPoints: [web]
  routes:
    - match: Host(`deck.example.kz`) && !PathPrefix(`/.well-known/acme-challenge/`)
      kind: Rule
      middlewares: [{ name: redirect-https }]
      services: [{ name: control-plane, port: 8080 }]
