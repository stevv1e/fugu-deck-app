apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  labels: { app.kubernetes.io/name: control-plane, app.kubernetes.io/part-of: fugu-deck }
spec:
  replicas: 1
  strategy: { type: Recreate }   # SQLite + ключи на одном томе
  selector: { matchLabels: { app.kubernetes.io/name: control-plane } }
  template:
    metadata: { labels: { app.kubernetes.io/name: control-plane } }
    spec:
      serviceAccountName: control-plane
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: control-plane
          image: control-plane-image   # подменяется в overlay (kustomize images)
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: control-plane-config }
            - secretRef: { name: control-plane-secrets, optional: true }
          env:
            - { name: CP_DATA_DIR, value: /data }
            - { name: CP_STATIC_DIR, value: /app/static }
            - { name: CP_ORCHESTRATOR, value: kubernetes }
            - { name: CP_CONTROL_PLANE_NAMESPACE, value: deck-system }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe: { httpGet: { path: /cp/api/health, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /cp/api/health, port: http }, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: control-plane-data } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
