# НЕ коммитьте настоящие значения. Создайте секрет вручную один раз:
#   kubectl -n deck-system create secret generic control-plane-secrets \
#     --from-literal=CP_BOOTSTRAP_CODE="$(openssl rand -hex 8)"
# (или через Sealed Secrets / External Secrets, если хотите держать его в git зашифрованным)
apiVersion: v1
kind: Secret
metadata: { name: control-plane-secrets, namespace: deck-system }
stringData:
  CP_BOOTSTRAP_CODE: change-me
