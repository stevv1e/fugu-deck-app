apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: deck-system
resources:
  - ../../base
configMapGenerator:
  - name: control-plane-config
    literals:
      - CP_RP_ID=deck.example.kz
      - CP_ORIGIN=https://deck.example.kz
      - CP_INGRESS_HOST=deck.example.kz
      - CP_SPACE_IMAGE=ghcr.io/your_login/fugu-deck-space:latest
      - CP_WARN_AFTER_HOURS=48
      - CP_PURGE_AFTER_HOURS=72
      - CP_SPACE_STORAGE=2Gi
# Образ control-plane. CI обновляет newTag после каждой сборки (GitOps: коммит в git → Argo CD выкатывает).
images:
  - name: control-plane-image
    newName: ghcr.io/your_login/fugu-deck-cp
    newTag: latest
patches:
  # домен в сертификате и маршрутах
  - target: { kind: Certificate, name: deck-tls }
    patch: |-
      - op: replace
        path: /spec/dnsNames/0
        value: deck.example.kz
