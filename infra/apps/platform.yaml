# Выпуск сертификатов и egress-прокси
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deck-platform
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_LOGIN/fugu-deck.git
    targetRevision: main
    path: infra/platform
  destination: { server: https://kubernetes.default.svc }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
